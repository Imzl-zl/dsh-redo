name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The test suite runs TypeScript directly through Node's type
          # stripping, so the runner must match the dev toolchain's major.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # `engines.dsh` is a promise DSH enforces at install and at profile startup:
  # outside the range the bundle is refused. This job is what keeps that promise
  # honest — one row per end of the declared range, installed at the exact DSH
  # release (and its vendored cordis) a user on that version resolves.
  #
  # The dev dependencies in package.json are only the type-check target, never
  # the contract, which is why each row repins them instead of trusting them.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lower bound of `engines.dsh`.
          - dsh: '0.2.1-rc.2'
            cordis: '4.0.5'
          # Upper bound: the newest release this package is verified against.
          - dsh: '0.2.2-rc.1'
            cordis: '4.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/pin-dsh-deps.mjs ${{ matrix.dsh }} ${{ matrix.cordis }}
      # The lockfile describes the default pins, so it is rebuilt for this row.
      - run: rm -f package-lock.json && npm install
      - run: npm run typecheck
      - run: npm test
