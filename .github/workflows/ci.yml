name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The test suite runs TypeScript directly through Node's type
          # stripping, so the runner must match the dev toolchain's major.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # `engines.dsh` is enforced at install and profile startup. This matrix checks
  # the minimum supported release with its vendored cordis; build checks the
  # development target. Dev dependencies are the type-check target, not the
  # compatibility contract, so pin both explicitly here.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported release; it also carries the complete-reference image-read API.
          - dsh: '0.2.2-rc.1'
            cordis: '4.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/pin-dsh-deps.mjs ${{ matrix.dsh }} ${{ matrix.cordis }}
      # The lockfile describes the default pins, so it is rebuilt for this row.
      - run: rm -f package-lock.json && npm install
      - run: npm run typecheck
      - run: npm test
